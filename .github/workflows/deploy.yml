# Publica Mars Survival Map en GitHub Pages en cada push a main.
# El juego vive en la subcarpeta mars-survival-map/: se compila con Vite (base relativa) y se publica su dist/.
# Requisito unico: en GitHub, Settings > Pages > Source: "GitHub Actions".
name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "mars-survival-map/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# un solo despliegue a la vez; uno nuevo no cancela el que ya esta publicando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mars-survival-map
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mars-survival-map/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mars-survival-map/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
